name: e2e-tests-main

on:
  workflow_call:
    inputs:
      build-extension:
        description: Build and preload the extension from the checked-out source
        type: boolean
        default: false
      extension-image:
        description: Published extension image to install when build-extension is false
        type: string
        default: ghcr.io/podman-desktop/extension-grype:next
  # Test the merged commit only after its image has been published.
  workflow_run:
    workflows: ['next-build.yaml']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build-extension:
        description: Build and preload the extension from the checked-out source
        type: boolean
        default: false
      extension-image:
        description: Published extension image to install when build-extension is false
        type: string
        default: ghcr.io/podman-desktop/extension-grype:next

permissions:
  contents: read

jobs:
  e2e-tests:
    name: Grype installation smoke tests
    # next-build only runs on main push/dispatch; still reject PR-triggered workflow_run.
    # When main moved past the built commit, skip so we never run tip tests against an older image
    # (avoids checking out workflow_run.head_sha under workflow_dispatch / cache-write context).
    if: >
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      SKIP_INSTALLATION: ${{ inputs.build-extension && 'true' || 'false' }}
    steps:
      # Checkout the workflow's own github.sha only. For post-next-build runs the job if
      # above requires head_sha == github.sha, so tests match the published image tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: extension-grype
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: podman-desktop/podman-desktop
          ref: main
          path: podman-desktop
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        name: Install Podman Desktop's pnpm version
        with:
          package_json_file: podman-desktop/package.json
          run_install: false

      - name: Allow Electron's sandbox on Ubuntu
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install Podman Desktop dependencies
        working-directory: podman-desktop
        run: pnpm install --frozen-lockfile

      - name: Build Podman Desktop for E2E tests
        working-directory: podman-desktop
        run: pnpm test:e2e:build

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        name: Install Grype's pnpm version
        with:
          package_json_file: extension-grype/package.json
          run_install: false

      - name: Install Grype dependencies
        working-directory: extension-grype
        run: pnpm install --frozen-lockfile

      # Match the framework to Podman Desktop main, as in bootc's PR checks.
      - name: Use the nightly Podman Desktop test framework
        working-directory: extension-grype/tests/playwright
        run: pnpm add --save-dev --save-exact @podman-desktop/tests-playwright@next

      - name: Install Playwright dependencies
        working-directory: extension-grype/tests/playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build local extension image
        if: inputs.build-extension
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: extension-grype
          tags: e2e
          containerfiles: extension-grype/Containerfile
          context: ./extension-grype
          # Match next-build.yaml so the preloaded bytes mirror the published image.
          extra-args: |
            --squash

      - name: Preload local extension into the test profile
        if: inputs.build-extension
        working-directory: extension-grype
        run: |
          container_id=$(podman create --entrypoint /bin/true localhost/extension-grype:e2e)
          trap 'podman rm "$container_id"' EXIT
          podman export --output "$RUNNER_TEMP/grype-extension.tar" "$container_id"
          mkdir -p tests/playwright/tests/output/grype-tests-pd/plugins
          tar -xf "$RUNNER_TEMP/grype-extension.tar" -C tests/playwright/tests/output/grype-tests-pd/plugins
          test -f tests/playwright/tests/output/grype-tests-pd/plugins/extension/package.json
          test -f tests/playwright/tests/output/grype-tests-pd/plugins/extension/dist/extension.cjs

      - name: Resolve OCI image
        if: ${{ !inputs.build-extension }}
        id: oci-image
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          EXTENSION_IMAGE: ${{ inputs.extension-image }}
        run: |
          case "${EXTENSION_IMAGE}" in
            *$'\n'* | *$'\r'*)
              echo "Refusing newline/control characters in extension-image" >&2
              exit 1
              ;;
          esac
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            image="ghcr.io/${REPOSITORY}:${WORKFLOW_RUN_SHA}"
          elif [ -n "${EXTENSION_IMAGE}" ]; then
            image="${EXTENSION_IMAGE}"
          else
            image="ghcr.io/podman-desktop/extension-grype:next"
          fi
          echo "value=${image}" >> "$GITHUB_OUTPUT"

      - name: Run installation smoke tests
        working-directory: extension-grype
        env:
          PODMAN_DESKTOP_ARGS: ${{ github.workspace }}/podman-desktop
          OCI_IMAGE: ${{ steps.oci-image.outputs.value || 'ghcr.io/podman-desktop/extension-grype:next' }}
        run: pnpm test:e2e --grep @installation

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@4a26df3e2ae132254ba12a53f65a388d0961e786 # v6.7.0
        with:
          annotate_only: true
          fail_on_failure: true
          include_passed: true
          detailed_summary: true
          require_tests: true
          report_paths: extension-grype/tests/playwright/tests/output/junit-results.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-e2e-tests
          retention-days: 14
          path: |
            extension-grype/tests/playwright/output/
            extension-grype/tests/playwright/tests/output/
