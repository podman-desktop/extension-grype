name: Podman Desktop Grype E2E Nightly

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      podman_desktop_repo_args:
        default: 'REPO=podman-desktop,FORK=podman-desktop,BRANCH=main'
        description: 'Podman Desktop repo fork and branch (allowlisted keys: REPO,FORK,BRANCH)'
        type: string
        required: true
      ext_repo_options:
        default: 'REPO=extension-grype,FORK=podman-desktop,BRANCH=main'
        description: 'Extension repo, fork and branch (allowlisted keys: REPO,FORK,BRANCH)'
        type: string
        required: true
      ext_tests_options:
        default: 'EXT_RUN_TESTS_FROM_EXTENSION=1'
        description: 'E2E options (allowlisted: EXT_RUN_TESTS_FROM_EXTENSION)'
        type: string
        required: true
      npm_target:
        default: 'test:e2e'
        description: 'npm script to run (must match ^test(:[A-Za-z0-9._-]+)*$)'
        type: string
        required: true
      podman_version:
        default: 'latest'
        description: 'Podman version (use "latest" to auto-fetch latest release, or specify version like "v5.6.1")'
        type: string
        required: true
      podman_options:
        default: 'INIT=1,START=1,ROOTFUL=1,NETWORKING=0'
        description: 'Podman machine options (allowlisted: INIT,START,ROOTFUL,NETWORKING)'
        type: string
        required: true
      env_vars:
        default: 'CI=true,TEST_PODMAN_MACHINE=true,ELECTRON_ENABLE_INSPECT=true'
        description: 'Env vars for the target machine (allowlisted keys only)'
        type: string
        required: true
      pde2e_image_version:
        default: 'v0.0.3'
        description: 'PDE2E runner, builder, podman image versions'
        type: string
        required: true
      podman_provider:
        default: 'wsl'
        description: 'Podman virtualization provider'
        type: 'string'
        required: true
      mapt_params:
        description: |
          **Create instance overrides (leave empty to use repo variables)**

          **Format:** VERSION_TAG=xxx;CPUS=xxx;MEMORY=xxx;EXCLUDED_REGIONS=xxx

          IMAGE overrides are ignored; MAPT_IMAGE always comes from vars.MAPT_IMAGE
          or quay.io/redhat-developer/mapt.
        required: false
        type: string

permissions:
  contents: read

jobs:
  windows:
    if: github.repository == 'podman-desktop/extension-grype' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 240
    name: windows-${{ matrix.windows-version }}-${{ matrix.windows-featurepack }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        windows-version: ['10', '11']
        windows-featurepack: ['22h2-ent', '23h2-ent']
        exclude:
          - windows-version: '10'
            windows-featurepack: '23h2-ent'
          - windows-version: '11'
            windows-featurepack: '22h2-ent'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch latest Podman version
        id: fetch-podman
        uses: redhat-actions/podman-install/.github/actions/fetch-latest-podman-version-windows@aea6ff44f2a4a82da13d22061ce73443a125925d
        with:
          version_input: ${{ inputs.podman_version || 'latest' }}
          file_type: 'msi'
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure the test run
        env:
          NPM_TARGET: ${{ inputs.npm_target || 'test:e2e' }}
          ENV_VARS: ${{ inputs.env_vars || 'CI=true,TEST_PODMAN_MACHINE=true,ELECTRON_ENABLE_INSPECT=true' }}
          PODMAN_PROVIDER: ${{ inputs.podman_provider || 'wsl' }}
          PODMAN_URL: ${{ steps.fetch-podman.outputs.download_url }}
          PDE2E_IMAGE_VERSION: ${{ inputs.pde2e_image_version || 'v0.0.3' }}
          PD_REPO_ARGS: ${{ inputs.podman_desktop_repo_args || 'REPO=podman-desktop,FORK=podman-desktop,BRANCH=main' }}
          EXT_TESTS_OPTIONS: ${{ inputs.ext_tests_options || 'EXT_RUN_TESTS_FROM_EXTENSION=1' }}
          PODMAN_OPTIONS: ${{ inputs.podman_options || 'INIT=1,START=1,ROOTFUL=1,NETWORKING=0' }}
          EXT_REPO_OPTIONS: ${{ inputs.ext_repo_options || 'REPO=extension-grype,FORK=podman-desktop,BRANCH=main' }}
          MAPT_PARAMS: ${{ inputs.mapt_params }}
          MAPT_IMAGE: ${{ vars.MAPT_IMAGE || 'quay.io/redhat-developer/mapt' }}
          MAPT_VERSION_TAG: ${{ vars.MAPT_VERSION_TAG || 'v0.9.8' }}
          MAPT_CPUS: ${{ vars.MAPT_CPUS || '8' }}
          MAPT_MEMORY: ${{ vars.MAPT_MEMORY || '32' }}
          MAPT_EXCLUDED_REGIONS: ${{ vars.MAPT_EXCLUDED_REGIONS || 'westindia,centralindia,southindia,australiacentral,australiacentral2,australiaeast,australiasoutheast,southafricanorth,southafricawest' }}
        run: bash .github/scripts/configure-windows-e2e.sh

      - name: Create instance
        id: create-instance
        uses: podman-desktop/e2e/.github/actions/create-instance@213a276952d746324895f63cea0b23083013990f
        with:
          mapt-image: ${{ env.MAPT_IMAGE || '' }}
          mapt-version: ${{ env.MAPT_VERSION_TAG || '' }}
          windows-version: ${{ matrix.windows-version }}
          windows-featurepack: ${{ matrix.windows-featurepack }}
          cpus: ${{ env.MAPT_CPUS || '' }}
          memory: ${{ env.MAPT_MEMORY || '' }}
          excluded-regions: ${{ env.MAPT_EXCLUDED_REGIONS || '' }}
          arm-tenant-id: ${{ secrets.ARM_TENANT_ID }}
          arm-subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          arm-client-id: ${{ secrets.ARM_CLIENT_ID }}
          arm-client-secret: ${{ secrets.ARM_CLIENT_SECRET }}

      - name: Check instance system info
        uses: podman-desktop/e2e/.github/actions/instance-system-info@3548105f45def129d5e3aaa5a3d922e09ac892d9

      - name: Emulate X session
        uses: podman-desktop/e2e/.github/actions/emulate-x-session@3548105f45def129d5e3aaa5a3d922e09ac892d9

      - name: Download Podman, do not initialize
        uses: podman-desktop/e2e/.github/actions/download-podman-nightly@952cafee20ca82b1ce48b29c848bac1c31062245
        with:
          podman-image-tag: ${{ env.PDE2E_IMAGE_VERSION }}
          podman-download-url: ${{ env.PODMAN_URL }}

      - name: Build Podman Desktop Electron Inspect Enabled binary
        uses: podman-desktop/e2e/.github/actions/build-podman-desktop@0c1f0a035e0949941fd6abf959ab556ceec13f03
        with:
          builder-tag: ${{ env.PDE2E_IMAGE_VERSION }}
          fork: ${{ env.PD_FORK }}
          branch: ${{ env.PD_BRANCH }}
          env-vars: ${{ env.ENV_VARS }}

      - name: Run Podman Desktop Playwright E2E tests
        uses: podman-desktop/e2e/.github/actions/run-playwright-test@3be2732e73c25503264a00890b78a1d03f6ad718
        with:
          pde2e-runner-tag: ${{ env.PDE2E_IMAGE_VERSION }}
          podman-desktop-path: true
          fork-repo: ${{ env.PD_FORK }}
          branch-name: ${{ env.PD_BRANCH }}
          ext-repo: ${{ env.EXT_REPO }}
          ext-fork: ${{ env.EXT_FORK }}
          ext-branch: ${{ env.EXT_BRANCH }}
          ext-tests: ${{ env.EXT_RUN_TESTS_FROM_EXTENSION }}
          npm-target: ${{ env.NPM_TARGET }}
          podman-init: ${{ env.PODMAN_INIT }}
          podman-start: ${{ env.PODMAN_START }}
          rootful: ${{ env.PODMAN_ROOTFUL }}
          user-networking: ${{ env.PODMAN_NETWORKING }}
          podman-provider: ${{ env.PODMAN_PROVIDER }}
          env-vars: ${{ env.ENV_VARS }}
          ci-bot-token: ${{ secrets.PODMAN_DESKTOP_BOT_TOKEN }}

      - name: Destroy instance
        if: always()
        uses: podman-desktop/e2e/.github/actions/destroy-instance@36e440f2ac18193214f4ffa8f7f1c4c0cb8c9446
        with:
          mapt-image: ${{ env.MAPT_IMAGE }}
          mapt-version: ${{ env.MAPT_VERSION_TAG }}
          arm-tenant-id: ${{ secrets.ARM_TENANT_ID }}
          arm-subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          arm-client-id: ${{ secrets.ARM_CLIENT_ID }}
          arm-client-secret: ${{ secrets.ARM_CLIENT_SECRET }}

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@4a26df3e2ae132254ba12a53f65a388d0961e786 # v6.7.0
        if: always() # always run even if the previous step fails
        with:
          annotate_only: true
          fail_on_failure: true
          include_passed: true
          detailed_summary: true
          require_tests: true
          report_paths: '**/*results.xml'

      - name: Upload test artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: results-e2e-${{ matrix.windows-version }}${{ matrix.windows-featurepack }}
          retention-days: 14
          path: |
            results/**/*results.xml
            results/**/*.log
            results/**/screenshots/**
            results/**/junit*
          if-no-files-found: warn
