name: e2e

on:
  workflow_call:
    inputs:
      build-extension:
        description: Build and preload the extension from the checked-out source
        type: boolean
        default: false
      extension-image:
        description: Published extension image to install when build-extension is false
        type: string
        default: ghcr.io/podman-desktop/extension-grype:next
  # Test the merged commit only after its image has been published.
  workflow_run:
    workflows: ['next-build.yaml']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      build-extension:
        description: Build and preload the extension from the checked-out source
        type: boolean
        default: false
      extension-image:
        description: Published extension image to install when build-extension is false
        type: string
        default: ghcr.io/podman-desktop/extension-grype:next

permissions:
  contents: read

concurrency:
  # workflow_run.id keeps each post-next-build smoke isolated so a newer main build
  # does not cancel an in-progress test of the previous image.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-extension:
    name: Build Extension Image
    if: inputs.build-extension
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build Image and Extract Files
        run: |
          podman build -t local_image ./
          container_id=$(podman create --entrypoint /bin/true localhost/local_image)
          trap 'podman rm -f "$container_id"' EXIT
          mkdir -p output/plugins
          podman export "$container_id" | tar -x -C output/plugins/
          test -f output/plugins/extension/package.json
          test -f output/plugins/extension/dist/extension.cjs

      - name: Upload Grype plugin artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-plugin
          path: output/plugins/
          retention-days: 1

  e2e-tests:
    name: Grype installation smoke tests
    needs: build-extension
    # next-build only runs on main push/dispatch; still reject PR-triggered workflow_run.
    # When main moved past the built commit, skip so tip tests are not run against an older image.
    if: >
      always() &&
      (needs.build-extension.result == 'success' || needs.build-extension.result == 'skipped') &&
      (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request' &&
        github.event.workflow_run.head_sha == github.sha))
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      CI: 'true'
      SKIP_INSTALLATION: ${{ needs.build-extension.result == 'success' && 'true' || 'false' }}
      # Required with PODMAN_DESKTOP_BINARY so tests-playwright attaches over CDP (see Quadlet e2e).
      EXTENSION_PREINSTALLED: ${{ needs.build-extension.result == 'success' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install Grype dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract @podman-desktop/api version
        id: pd-api-version
        shell: bash
        run: |
          PD_VERSION=$(pnpm why -C packages/backend "@podman-desktop/api" --json | jq -r '.[0].version')
          echo "PD_VERSION=$PD_VERSION" >> "$GITHUB_OUTPUT"
          echo "Using @podman-desktop/api $PD_VERSION"

      - name: Install Podman Desktop
        id: podman-desktop-install
        uses: podman-desktop/gh-extensions-actions/.github/actions/podman-desktop-install@e59cd52b942e8dfcc187293c5d8e9f3831c7ac0c # v0.11.0
        with:
          version: ${{ steps.pd-api-version.outputs.PD_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Match the framework to Podman Desktop main, as in other extension PR checks.
      - name: Use the nightly Podman Desktop test framework
        working-directory: tests/playwright
        run: pnpm add --save-dev --save-exact @podman-desktop/tests-playwright@next

      - name: Install Playwright browser
        working-directory: tests/playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Download Grype plugin
        if: needs.build-extension.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: grype-plugin
          path: tests/playwright/tests/output/grype-tests-pd/plugins/

      - name: Resolve OCI image
        if: needs.build-extension.result != 'success'
        id: oci-image
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          EXTENSION_IMAGE: ${{ inputs.extension-image }}
        run: |
          case "${EXTENSION_IMAGE}" in
            *$'\n'* | *$'\r'*)
              echo "Refusing newline/control characters in extension-image" >&2
              exit 1
              ;;
          esac
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            image="ghcr.io/${REPOSITORY}:${WORKFLOW_RUN_SHA}"
          elif [ -n "${EXTENSION_IMAGE}" ]; then
            image="${EXTENSION_IMAGE}"
          else
            image="ghcr.io/podman-desktop/extension-grype:next"
          fi
          echo "url=${image}" >> "$GITHUB_OUTPUT"

      - name: Run installation smoke tests
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
          NODE_OPTIONS: --no-experimental-strip-types
          DEBUGGING_PORT: '9222'
          PODMAN_DESKTOP_BINARY: ${{ steps.podman-desktop-install.outputs.binary }}
          OCI_IMAGE: ${{ steps.oci-image.outputs.url || 'ghcr.io/podman-desktop/extension-grype:next' }}
        run: pnpm test:e2e --grep @installation

      - name: Publish test report
        if: always()
        uses: mikepenz/action-junit-report@4a26df3e2ae132254ba12a53f65a388d0961e786 # v6.7.0
        with:
          annotate_only: true
          fail_on_failure: true
          include_passed: true
          detailed_summary: true
          require_tests: true
          report_paths: tests/playwright/tests/output/junit-results.xml

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: grype-e2e-tests
          retention-days: 14
          path: |
            tests/playwright/output/
            tests/playwright/tests/output/
